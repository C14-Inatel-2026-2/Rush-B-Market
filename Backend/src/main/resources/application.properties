# Application
spring.application.name=Rush-B-Market API
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/rushbmarket
spring.datasource.username=csuser
spring.datasource.password=cspass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=on_param

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.rushbmarket=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
